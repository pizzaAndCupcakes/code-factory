name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # The merge workflow looks for a check with exactly this name on the head commit.
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./factory/gate.sh
